name: Upstream dependency drift
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: drift-${{ github.ref }}
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Isolate live resolution from runner image packages
        run: |
          python -m venv "$RUNNER_TEMP/quantfit-drift"
          echo "$RUNNER_TEMP/quantfit-drift/bin" >> "$GITHUB_PATH"
      - name: Deliberately resolve supported dependencies afresh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[dev,inspect]' pytest-cov hypothesis 'pip-audit==2.10.1'
          python -m pip check
          python -m pip freeze
          python -m pytest tests -q
      - name: Audit the resolved installed dependency graph
        if: always()
        run: python tools/ci_dependency_audit.py
