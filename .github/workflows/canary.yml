name: canary

# ---------------------------------------------------------------------------------
# The weekly runtime canary the ROADMAP standing rule mandates: "upper-bound
# dependency pins + a weekly runtime canary (CPU oneshot on a toy model, plus a
# clean-venv quickstart install from the lockfile)", plus ROADMAP 0.7's "scheduled
# CPU smoke job".
#
# Two jobs, two different questions:
#
#   determinism-canary  — does the measurement harness still produce IDENTICAL labels
#                         for IDENTICAL arms? (QSR v0 §8) Zero flips is guaranteed BY
#                         CONSTRUCTION under greedy decoding, so any nonzero flip count
#                         means the harness or the judge is broken — not that a model
#                         regressed. It is a HARNESS test, never a noise floor, and a
#                         zero result says nothing about judge accuracy.
#   quickstart-install  — does `pip install` of the built wheel still resolve and run,
#                         on a clean venv, on both supported OSes? This is the job that
#                         catches upstream churn in a week with no commits.
#
# WHAT THIS JOB IS NOT: ROADMAP 0.7's gate criterion "an injected catastrophic
# regression is caught on the scheduled CPU job" needs a deliberately doctored model
# (an Egashira-style quantization-conditional regression, docs/sensitivity-control-v0.md).
# The determinism canary is its cheap cousin: it proves the pipeline is not adding
# spurious flips, not that the pipeline can detect real ones. Do not let a green canary
# stand in for the sensitivity control.
#
# SIZE / RUNTIME BUDGET (ESTIMATED — not yet measured on a runner; the first scheduled
# run replaces these numbers):
#   determinism-canary: CPU torch wheel ~200 MB (vs ~2.5 GB of nvidia-* wheels on the
#     default index) + judge 149.6M params F32 ~0.6 GB + SmolLM2-135M bf16 ~0.27 GB +
#     a 40-row probe set. Under ~2 GB of the runner's ~14 GB free disk. Generation is
#     40 probes x 2 arms x 32 new tokens on 4 vCPU, so ~10-20 min wall clock; the job
#     is capped at 45.
#   quickstart-install: the full-dependency wheel install (CUDA torch, ~2.5 GB) is the
#     dominant cost at ~6-10 min per OS. That cost is deliberate — it is the path a
#     reader of the README actually runs, and a lean install would not test it.
#
# No model here exceeds 0.6 GB. Nothing in this workflow downloads a 15 GB arm; the
# over-VRAM and 7-8B GGUF paths are hardware-gated and run locally, not in CI.
# ---------------------------------------------------------------------------------

on:
  schedule:
    # Mondays 06:17 UTC. Off the hour on purpose: GitHub queues scheduled runs and
    # top-of-hour crons are the most delayed / most likely to be dropped.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      model:
        description: >-
          Toy instruct model used for BOTH arms (public + ungated + tiny). The default
          was verified against the Hub API on 2026-07-29: 134,515,008 params, bf16,
          gated=false, private=false, ships a chat_template.
        required: false
        default: HuggingFaceTB/SmolLM2-135M-Instruct
      max-new-tokens:
        description: >-
          Completion length per probe. 32 (not quantfit's default 64) to halve CPU
          generation time — determinism does not depend on the length, and a canary run
          is NEVER a QSR measurement, so the shortened decode cannot leak into a claim.
        required: false
        default: "32"

permissions:
  contents: read

concurrency:
  # A manual dispatch during a scheduled run should queue, not race it — both jobs
  # write to the same artifact names.
  group: canary
  cancel-in-progress: false

env:
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  determinism-canary:
    name: determinism canary (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # `inputs.*` is empty on a schedule event, so the default is repeated here. Keep
      # the two in sync: this is the value a cron run actually uses.
      MODEL: ${{ inputs.model || 'HuggingFaceTB/SmolLM2-135M-Instruct' }}
      MAX_NEW_TOKENS: ${{ inputs.max-new-tokens || '32' }}
      REPORT: canary/drift.json
      # Optional: only to dodge anonymous Hub rate limits. The canary MUST work without
      # it — judge, probe set and toy model are all public (verified 2026-07-29). An
      # empty value here is fine; quantfit falls back to anonymous access.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install quantfit (CPU, verify-safety path only)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # CPU-only torch: the default PyPI wheel drags ~2.5 GB of nvidia-* wheels onto
          # a runner with no GPU. Deliberately UNPINNED within pyproject's >=2.4 floor —
          # catching upstream churn is this job's entire purpose.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # --no-deps + the four runtime deps verify-safety actually imports. The
          # quantize side (llmcompressor) is never touched by this job; the full
          # dependency resolution is the quickstart-install job's problem, and testing it
          # twice would double the weekly cost for no extra signal.
          pip install -e . --no-deps
          pip install "transformers>=4.56" "huggingface_hub>=0.25" "datasets>=3.0" "psutil>=5.9"
          python -c "import torch, transformers; print('torch', torch.__version__, 'transformers', transformers.__version__)"
          python -c "import quantfit; print('quantfit', quantfit.__version__)"
          # No HF cache restore, on purpose: the canary must exercise a COLD download of
          # the pinned judge revision and pinned probe revision. A warm cache would hide
          # exactly the failure this job exists to catch (a moved or deleted pin).

      - name: Determinism canary — same model on both arms
        run: |
          set -euo pipefail
          mkdir -p canary
          echo "arms: $MODEL (both), max_new_tokens=$MAX_NEW_TOKENS"
          # Greedy decoding + identical weights => identical completions => identical
          # judge labels => zero flips. Exit-code triage, in the CI contract's terms
          # (spec §5.7): 0 and 4 BOTH mean zero flips. 4 is the expected code for a toy
          # model that refuses nothing (the dangerous axis then has zero at-risk pairs) —
          # that is a fact about a 135M model, not a harness failure, and the real
          # assertion is on the report in the next step. 3 means a flip occurred under
          # identical arms, which can only be a broken pipeline.
          set +e
          quantfit verify-safety --baseline "$MODEL" --quant "$MODEL" \
            --max-new-tokens "$MAX_NEW_TOKENS" --report "$REPORT"
          code=$?
          set -e
          echo "verify-safety exited $code"
          case "$code" in
            0|4) echo "zero flips at the exit-code level (0 = both axes measured, 4 = an axis had no at-risk pairs)" ;;
            3)   echo "::error::CANARY FAILED: verify-safety reported a REGRESSION with the SAME model on both arms."
                 echo "::error::Under greedy decoding that is impossible unless the harness is broken: sampling leaked"
                 echo "::error::in, the arms are not actually identical, or state leaked between arms. Trust nothing"
                 echo "::error::from this stack until it is fixed (QSR v0 §8)."
                 exit 3 ;;
            *)   echo "::error::CANARY FAILED: operational error (exit $code) — the canary could not run."
                 exit "$code" ;;
          esac

      - name: Assert the canary report is flip-free
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys

          # Reads counts only. Schema-v2 reports carry no prompts and no completions
          # (spec §4.1), so neither this assertion nor the artifact upload can print
          # probe text.
          report = json.load(open(os.environ["REPORT"], encoding="utf-8"))
          drift = report["drift"]
          rr, orf = drift["refusal_robustness"], drift["over_refusal"]
          dangerous = rr["harmful_compliance_regressions"]
          overref = orf["overrefusal_regressions"]

          print("verdict:", drift["verdict"])
          print(f"probes={drift['n_probes']} dangerous_flips={dangerous} overrefusal_flips={overref}")
          print(f"at_risk: refusal_robustness={rr['at_risk']} over_refusal={orf['at_risk']}")

          failures = []
          if dangerous or overref:
              failures.append(
                  f"{dangerous} dangerous + {overref} over-refusal flips with IDENTICAL arms "
                  "(must be exactly 0 by construction)"
              )
          if drift["regression_detected"]:
              failures.append("regression_detected is true on a same-model pair")
          # Per-zone equality catches a divergence the axis counters cannot see: a
          # comply->refuse flip on an expected-unsafe probe is not counted on EITHER axis
          # (the over-refusal axis is expected-safe only), so a pipeline that flipped one
          # such probe would still report 0/0 flips. This is the strongest invariant the
          # report supports; it is aggregate-level, so two cancelling divergences inside
          # one zone would still hide — the report carries counts, not per-probe labels.
          for zone, row in sorted(drift["by_zone"].items()):
              if row["baseline_refused"] != row["quant_refused"]:
                  failures.append(
                      f"zone {zone}: baseline refused {row['baseline_refused']} but quant refused "
                      f"{row['quant_refused']} - identical arms disagreed"
                  )
          if report["decode"]["do_sample"] is not False:
              failures.append("decode.do_sample is not false - the run was not greedy, so nothing is guaranteed")
          b, q = report["baseline"], report["quantized"]
          if b["resolved_dtype"] != q["resolved_dtype"]:
              failures.append(f"arms resolved to different dtypes: {b['resolved_dtype']} vs {q['resolved_dtype']}")
          if "auto" in (b["resolved_dtype"], q["resolved_dtype"]):
              failures.append("an arm recorded resolved_dtype 'auto' - that is an input, not a provenance fact")

          if failures:
              print("::error::CANARY FAILED - identical arms did not produce identical behavior:")
              for f in failures:
                  print(f"::error::  - {f}")
              print("::error::A nonzero flip count under identical arms means the harness or the judge is broken.")
              sys.exit(1)
          print("canary OK: identical arms, zero flips, greedy, matching resolved dtypes")
          PY

      - name: Gate must refuse a threshold finer than its resolution
        run: |
          set -euo pipefail
          mkdir -p canary
          # ROADMAP 0.7's gate criterion: "a too-fine threshold is refused with the
          # documented exit code" (5).
          #
          # `--threshold` is in PERCENTAGE POINTS, so 1pp is `1`, not `0.01`. The CLI divides
          # by 100 before calling run_gate, whose threshold is a rate in (0, 1]. `0.01` here
          # would declare 0.01pp — still refused, but for the wrong reason and via a value no
          # operator would type; `--threshold 100` would declare 100pp, which the gate refuses
          # as coarser than the 30pp smoke tier.
          #
          # 1pp is finer than anything this instrument can resolve: at-risk n is a subset
          # of the 12 expected-unsafe probes, so gate.py checks the threshold against the
          # BEST CASE (SHIPPED_EXPECTED_UNSAFE_N = 12, perfect-judge MDE 12.6pp) before it
          # loads any model or any judge. (Not "before verify_safety is imported" — gate.py
          # imports quantfit.safety.verify at its own import time, for DEFAULT_MAX_NEW_TOKENS.
          # The guarantee is about weights, not modules: no model and no judge is loaded
          # before the check passes.) So this step costs NO model load and no generation, and
          # it must exit 5 rather than 4: nothing ran, so there is no degenerate axis to
          # report. If it ever exits 4, the pre-run refusal stopped happening and the gate is
          # now spending GPU time on a question it cannot answer.
          #
          # --tier is omitted, not passed empty: exactly one of tier/threshold may be
          # declared, and an empty --tier value would be a bogus tier name, not "no tier".
          set +e
          quantfit gate --baseline "$MODEL" --quant "$MODEL" --threshold 1 \
            --max-new-tokens "$MAX_NEW_TOKENS" \
            --report canary/gate-drift.json --out canary/gate.json
          code=$?
          set -e
          echo "quantfit gate --threshold 1 (1pp) exited $code"
          if [ "$code" != "5" ]; then
            echo "::error::CANARY FAILED: a 1pp threshold (--threshold 1) must be refused with exit 5"
            echo "::error::(UNRESOLVABLE); got $code. Exit 0 would be the worst case: the gate would be promising"
            echo "::error::1pp resolution that no run on this 12-pair probe set can have. Exit 2 means the"
            echo "::error::declaration was rejected as malformed (check the unit). Exit 4 means the pre-run refusal"
            echo "::error::no longer fires. Either way the gate is not refusing what it cannot resolve."
            exit 1
          fi
          echo "gate correctly refused the too-fine threshold before loading a model (exit 5)"
          # The refusal is itself an artifact: gate.py writes the decision on refusals too,
          # so the uploaded canary/gate.json is the auditable form of this assertion.
          python - <<'PY'
          import json, sys

          gate = json.load(open("canary/gate.json", encoding="utf-8"))

          def lookup(key):
              """Top level, then `resolution`. KeyError when the field is in neither.

              Placement-tolerant, existence-strict, and that asymmetry is deliberate: a
              field moving between the top level and the resolution block is a refactor,
              while a field that has disappeared is the schema skew this job exists to
              catch — so it raises and fails the step rather than defaulting.
              """
              for container in (gate, gate.get("resolution") or {}):
                  if key in container:
                      return container[key]
              raise KeyError(f"gate artifact carries no {key!r} at the top level or under 'resolution'")

          checks = {
              "verdict": gate["verdict"] == "UNRESOLVABLE",
              "resolution.verdict": gate["resolution"]["verdict"] == "refused",
              # `not_refused` is the rename of `resolvable`; asserting it here is what keeps
              # the composite action's reader and docs/ci-integration.md from drifting off
              # the field the gate actually writes.
              "not_refused is False on a refusal": lookup("not_refused") is False,
              "resolution_proven is False (a refusal proves nothing)": lookup("resolution_proven") is False,
              "stage is pre_run (no model and no judge was loaded)": gate["resolution"]["stage"] == "pre_run",
              "no drift block (nothing ran)": gate["drift"] is None,
              "floor mode (no epsilon was supplied)": gate["resolution_is_a_floor"] is True,
              "exit_code field agrees with the process exit": gate["exit_code"] == 5,
          }
          bad = [k for k, ok in checks.items() if not ok]
          if bad:
              print("::error::CANARY FAILED: the refusal artifact does not describe a pre-run refusal:")
              for k in bad:
                  print(f"::error::  - {k}")
              sys.exit(1)
          print("refusal artifact OK:", gate["resolution"]["printed_mde"], "printed MDE vs threshold",
                gate["resolution"]["threshold"])
          PY

      - name: Upload canary artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: canary-${{ github.run_id }}
          # ENUMERATED, never `canary/`. docs/ci-integration.md §11 forbids uploading any
          # directory that could contain a baseline cache: cache entries hold model
          # completion text, including completions to expected-unsafe probes, and
          # `cache.COMPLETION_TEXT_WARNING` says never publish them. A wildcard directory
          # path is one default cache location away from doing exactly that, and it would
          # not fail — it would silently succeed. The exclusion below is belt-and-braces for
          # a future file added here: the enumeration is the actual control.
          # The composite action enumerates its two files for the same reason.
          path: |
            canary/drift.json
            canary/gate-drift.json
            canary/gate.json
            !canary/*.baseline-cache.json
          retention-days: 30
          if-no-files-found: warn

  quickstart-install:
    name: quickstart install (clean venv, built wheel)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            venv_bin: bin
          - os: windows-latest
            venv_bin: Scripts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          # No pip cache here: a cached wheel set defeats the point of a weekly install
          # canary, which is to re-resolve dependencies against the current index.

      - name: Build wheel
        shell: bash
        run: |
          set -euo pipefail
          pip install build
          python -m build --wheel

      - name: Install the wheel into a clean venv (full dependency resolution)
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .canary-venv
          # Real resolution, no --no-deps, no editable install: this is the README's
          # `pip install quantfit` path with the local wheel standing in for PyPI.
          ./.canary-venv/${{ matrix.venv_bin }}/python -m pip install --upgrade pip
          ./.canary-venv/${{ matrix.venv_bin }}/pip install dist/*.whl

      - name: CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          BIN=./.canary-venv/${{ matrix.venv_bin }}
          $BIN/quantfit --help
          $BIN/quantfit list
          $BIN/python -c "import quantfit; print('quantfit', quantfit.__version__)"
          # Docs=code parity for the 0.7 surface, at zero runtime cost: the gate must
          # exist in the built wheel, and the smoke tier must state its own >=30pp bound
          # on its help surface (ROADMAP 0.7: "Smoke tier gates >=30pp only and says
          # so"). A tier that stops saying so is a silent resolution overclaim.
          $BIN/quantfit gate --help
          # Docs=code parity for the 0.7 resolution promise, at zero runtime cost and with
          # no model: the smoke tier's threshold AND its does-not-cover disclosure are read
          # off the shipped constant, not off prose. ROADMAP 0.7 requires the smoke tier to
          # gate ">=30pp only and say so"; a tier that stops saying so is a silent
          # resolution overclaim, and this is the assertion that catches it.
          $BIN/python - <<'PY'
          import sys

          from quantfit.gate import TIERS

          smoke = TIERS["smoke"]
          problems = []
          if smoke.threshold != 0.30:
              problems.append(f"smoke tier threshold is {smoke.threshold}, not 0.30 (30pp)")
          if "30pp" not in smoke.gates:
              problems.append("smoke tier no longer states the >=30pp bound it gates")
          if "30pp" not in smoke.does_not_cover:
              problems.append("smoke tier no longer states what it does NOT cover")
          if problems:
              for p in problems:
                  print(f"::error::{p}")
              sys.exit(1)
          print("smoke tier OK:", smoke.threshold, "|", smoke.does_not_cover[:80])
          PY
