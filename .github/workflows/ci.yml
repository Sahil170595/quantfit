name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:
    inputs:
      qualify:
        description: Run pinned public-model CPU backend and judge qualification
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validation:
    uses: ./.github/workflows/validate.yml
    with:
      qualify: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.qualify) }}
  drift:
    if: github.event_name == 'workflow_dispatch' && inputs.qualify
    uses: ./.github/workflows/drift.yml
  required:
    name: CI required
    if: always()
    needs: [validation, drift]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.validation.result }}
          DRIFT: ${{ needs.drift.result }}
          EXPECT_DRIFT: ${{ github.event_name == 'workflow_dispatch' && inputs.qualify }}
        run: |
          test "$RESULT" = success
          if [ "$EXPECT_DRIFT" = true ]; then test "$DRIFT" = success; else test "$DRIFT" = skipped; fi
