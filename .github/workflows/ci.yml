name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:
    inputs:
      qualify:
        description: Run pinned public-model CPU backend and judge qualification
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validation:
    uses: ./.github/workflows/validate.yml
    with:
      qualify: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.qualify) }}
  required:
    name: CI required
    if: always()
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.validation.result }}
        run: test "$RESULT" = success
