name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Match the declared support (requires-python >=3.10 + classifiers 3.10-3.14).
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The unit tests mock the heavy backends; they only need these at import time.
      # scipy is the independent reference for the Wilson-CI / power cross-checks;
      # gguf crafts + reads the tiny GGUF files in the verify-safety arm tests.
      # inspect-ai: pure python, and the Inspect runner's parity-with-_tabulate
      # test is the only thing that substantiates "comparable artifacts" — a
      # permanently-skipped test would leave that claim untested.
      - run: pip install pytest huggingface_hub psutil scipy gguf inspect-ai
      # Build + install the package itself (no heavy deps) so import, the entry point,
      # and PEP 621/639 packaging metadata are exercised — not just the source tree.
      - run: pip install -e . --no-deps
      - run: pytest tests/ -q

  # The 0.3 release gate: a clean-venv install of the built wheel (real dependency
  # resolution, no mocks) must work on Linux AND Windows, and the CLI must run.
  install-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip  # the torch wheel dominates install time; cache it across runs

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Install wheel with full dependencies
        shell: bash
        run: pip install dist/*.whl

      - name: CLI smoke
        shell: bash
        run: |
          quantfit --help
          quantfit list
          python -c "import quantfit; print('quantfit', quantfit.__version__)"

      # ROADMAP 1.0's gate clause, as a script rather than a promise: every command
      # the README advertises must exist in the INSTALLED CLI, and the clean-venv
      # subset must actually run. Commands needing a GPU, the network or multi-GB
      # weights are reported UNRUN with reasons — this gate covers existence plus
      # that subset only, and says so.
      - name: README quickstart gate
        shell: bash
        run: python tools/quickstart_check.py

  # docs=code parity, enforced. Prose in this repo makes a very large number of
  # checkable claims (flags, exit codes, file:symbol citations, quoted constants,
  # schema fields); several drifted silently during development. A doc that no
  # longer describes the code now fails the build instead of aging quietly.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The auditor walks the real argparse parser and reads modules with ast, so it
      # needs the package importable — but no torch: it must stay a cheap CI step.
      - run: pip install -e . --no-deps

      - name: docs=code parity audit
        run: python -m quantfit.cli audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Bounded like every churning dep (ROADMAP standing rule): 0.16.0 shipped new
      # default rules mid-cycle and broke a green branch. The cap moves only after
      # a validated local run on the new minor.
      - run: pip install "ruff>=0.16,<0.17"

      - name: Ruff check
        run: ruff check quantfit tests tools

      - name: Ruff format
        run: ruff format --check quantfit tests
